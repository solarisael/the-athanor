name: CI

on:
  push:
  pull_request:

jobs:

  rust:
    name: Rust workspace
    runs-on: windows-latest
    steps:
      - name: Check out The Athanor
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build the substrate binary
        run: cargo build --release --locked -p athanor-substrate
      - name: Test the Rust workspace
        run: cargo test --workspace --locked

  omp:
    name: OMP adapter
    runs-on: windows-latest
    steps:
      - name: Check out The Athanor
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install workspace dependencies
        run: bun install
      - name: Adapter contract suite
        run: bun run test:omp
