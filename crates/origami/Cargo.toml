[package]
name = "origami"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-nats.workspace = true
chrono.workspace = true
hex.workspace = true
house-core = { path = "../house-core" }
# The sanitized boat-receipt stream and subject are protocol vocabulary
# shared with house-host, and house-protocol is their one declaration
# (coding#446 rule 4). Origami names them from there rather than minting a
# second copy. house-protocol depends only on house-core, so no cycle: the
# dependency arrow from every implementation crate still points at origami.
house-protocol = { path = "../house-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
uuid.workspace = true

[lib]
name = "origami"
path = "src/lib.rs"
