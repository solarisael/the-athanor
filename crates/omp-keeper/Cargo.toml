[package]
name = "omp-keeper"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "omp_keeper"
path = "src/lib.rs"

[[bin]]
name = "omp-keeper"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# absolute House instants: restart_status publishes RFC3339 text, the keeper compares it to now
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# the restart wire vocabulary: states, params, receipts (src/protocol.rs adds only the keeper's JSONL envelope)
house-protocol = { path = "../house-protocol" }
interactive-process = { path = "../interactive-process" }


[dev-dependencies]
tempfile = "3"
