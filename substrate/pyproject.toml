[project]
name = "athanor-substrate"
version = "0.1.0"
description = "PostgreSQL, pgvector, and local-embedding substrate for The Athanor"
requires-python = ">=3.11"
dependencies = [
  "psycopg2-binary>=2.9.9,<3",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
