name: Release native Windows runtime

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic release version"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Resolve release version
        shell: pwsh
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:REQUESTED -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw "invalid semantic version: $version" }
          $adapter = (Get-Content adapters/omp/package.json -Raw | ConvertFrom-Json).version
          $root = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($adapter -ne $version -or $root -ne $version) { throw "release version must match both package manifests" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
      - name: Stage checksum-verified native runtime
        shell: pwsh
        run: ./installer/build-native-release.ps1 -Version $env:VERSION -OutDir dist
      - name: Compile the Inno installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$env:VERSION" "/DSourceRoot=$env:GITHUB_WORKSPACE\dist" "installer\athanor.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $installer = Get-Item "dist\The-Athanor-$env:VERSION-windows-x64.exe"
          $all = @(Get-ChildItem dist -Filter '*.exe' -File)
          if ($all.Count -ne 1) { throw "release must contain exactly one Windows installer; found $($all.Count)" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
      - name: Retain release proof
        uses: actions/upload-artifact@v4
        with:
          name: the-athanor-${{ env.VERSION }}-windows-x64
          path: |
            dist/The-Athanor-${{ env.VERSION }}-windows-x64.exe
            dist/The-Athanor-${{ env.VERSION }}-windows-x64.exe.sha256
          if-no-files-found: error
      - name: Publish installer and checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/The-Athanor-${{ env.VERSION }}-windows-x64.exe
            dist/The-Athanor-${{ env.VERSION }}-windows-x64.exe.sha256
