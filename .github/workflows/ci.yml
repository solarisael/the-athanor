name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core TypeScript and Python
    runs-on: windows-latest
    steps:
      - name: Check out The Athanor
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install workspace dependencies
        run: bun install
      - name: Install substrate Python package
        run: python -m pip install -e "./substrate[test]"
      - name: Core TypeScript contracts
        run: bun run test:core
      - name: Core Python contracts
        run: bun run test:python
      - name: Substrate Python contracts
        run: bun run test:substrate

  rust:
    name: Rust workspace
    runs-on: windows-latest
    steps:
      - name: Check out The Athanor
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build the substrate binary
        run: cargo build --release --locked -p athanor-substrate
      - name: Test the Rust workspace
        run: cargo test --workspace --locked

  omp:
    name: OMP adapter
    runs-on: windows-latest
    env:
      SOLARISAEL_TEST_NATIVE_PYTHON: "1"
    steps:
      - name: Check out The Athanor
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install workspace dependencies
        run: bun install
      - name: Adapter contract suite
        run: bun run test:omp
