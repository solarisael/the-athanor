[package]
name = "athanor-install"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "athanor_install"
path = "src/lib.rs"

[[bin]]
name = "athanor"
path = "src/bin/athanor.rs"

[[bin]]
name = "athanor-manage"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
hex.workspace = true
protocol = { path = "../protocol" }
interactive-process = { path = "../interactive-process" }
omp-keeper = { path = "../omp-keeper" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
getrandom = "0.3"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Services", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"
