name: CI

on:
  push:
  pull_request:

jobs:

  rust:
    name: Rust workspace
    runs-on: windows-latest
    steps:
      - name: Check out The Athanor
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Build the substrate binary
        run: cargo build --release --locked -p akasha
      - name: Test the Rust workspace
        run: cargo test --workspace --locked

  installer-contract:
    name: Native release contract
    runs-on: windows-latest
    steps:
      - name: Check out The Athanor
        uses: actions/checkout@v4
      - name: Verify native release contracts
        shell: pwsh
        run: |
          ./installer/native-release-contract.test.ps1
          ./installer/omp-adapter-component.test.ps1

  omp:
    name: OMP adapter
    runs-on: windows-latest
    steps:
      - name: Check out The Athanor
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install workspace dependencies
        run: bun install
      - name: Adapter contract suite
        shell: pwsh
        run: |
          # Remove hosted-runner credentials without bypassing the live-configuration refusal.
          [Environment]::SetEnvironmentVariable("PGUSER", $null, "Process")
          [Environment]::SetEnvironmentVariable("PGPASSWORD", $null, "Process")
          bun run test:omp

  pages:
    name: Public Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out The Athanor
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Test public artifact contract
        run: node --test scripts/build-pages.test.mjs
      - name: Build public artifact
        run: npm run build:pages
