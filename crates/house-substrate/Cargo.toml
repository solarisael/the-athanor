[package]
name = "athanor-substrate"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
house-core = { path = "../house-core" }
house-protocol = { path = "../house-protocol" }
house-vault = { path = "../house-vault" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "time", "sync", "fs"] }
uuid = { version = "1", features = ["v4"] }

[lib]
name = "athanor_substrate"
path = "src/lib.rs"

[[bin]]
name = "athanor-substrate"
path = "src/main.rs"
