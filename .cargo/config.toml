# Build policy for every cargo invocation in this repository.
#
# One target directory for the whole workstation: build, test, check, clippy,
# and the release build in installer/build-native-release.ps1 all land here, and
# every worktree under C:/Projects/the-athanor-dev shares it, so a fanout of
# three worktrees compiles the dependency set once instead of three times
# (project lesson #465). The path is absolute on purpose; a relative one is a
# cold 15 GB tree per worktree. Another machine changes this one line.
#
# Payload staging lives in <checkout>/target/releases and nothing in this tree
# is ever pruned by the deploy ritual.
[build]
target-dir = "C:/Projects/the-athanor-target"

# Incremental artifacts are per-crate, per-target and never collected; a week
# of dev and test builds left 20 GB of them on 2026-09-02. A full recompile of
# one crate on this machine costs seconds; the cache cost gigabytes.
[profile.dev]
incremental = false

# Integration proofs share one PostgreSQL test database and one JetStream
# consumer per lane; run in parallel they race each other and fail on HEAD.
# Nothing here needs test parallelism yet (Sol, 2026-09-02).
[env]
RUST_TEST_THREADS = "1"
